[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stackpr"
version = "0.1.0"
description = "A tiny package used to demonstrate Stacked PR workflows."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "pydantic[email]>=2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
